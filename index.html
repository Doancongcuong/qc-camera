<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>QC Camera</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  #v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
  #bar{position:absolute;left:0;right:0;bottom:0;padding:12px 0 calc(24px + env(safe-area-inset-bottom));text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.7))}
  #st{font-size:14px;margin-bottom:10px;min-height:20px}
  #shot{width:76px;height:76px;border-radius:50%;background:#fff;border:5px solid #999}
  #shot:active{background:#ccc}
  #top{position:absolute;top:0;padding-top:calc(8px + env(safe-area-inset-top))!important;left:0;right:0;padding:8px 12px;background:rgba(0,0,0,.5);font-size:13px;display:flex;justify-content:space-between;align-items:center}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .15s}
  #camOff{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px;text-align:center;padding:20px}
  #qbadge{padding:3px 10px;border-radius:12px;font-weight:bold;transition:background .2s}
  #qbadge.empty{background:#1a6b1a}
  #qbadge.pending{background:#a85a00}
  #tools{position:absolute;right:12px;top:calc(56px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:10px}
  #tools button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:20px}
  #tools button.on{background:#f1c40f;color:#000}
  #zoomBadge{position:absolute;left:50%;transform:translateX(-50%);top:calc(56px + env(safe-area-inset-top));background:rgba(0,0,0,.5);padding:3px 10px;border-radius:12px;font-size:13px;display:none}
  #pushNow{display:none;margin-top:8px;padding:6px 14px;border-radius:6px;border:0;background:#2980b9;color:#fff;font-size:13px}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<div id="camOff">Chạm màn hình để bật camera</div>
<div id="flash"></div>
<div id="top"><span id="cnt">Đã gửi: 0</span><span id="qbadge" class="empty">Hàng đợi: 0</span></div>
<div id="tools"><button id="torchBtn" aria-label="Đèn flash" style="display:none">🔦</button><button id="fastBtn" aria-label="Chụp nhanh">⚡</button><button id="fsBtn" aria-label="Toàn màn hình">⛶</button></div>
<div id="zoomBadge">1.0×</div>
<div id="bar">
  <div id="st">Chạm màn hình để bật camera, chạm nút để chụp</div>
  <button id="shot" aria-label="Chụp"></button>
  <div><button id="pushNow">⏫ Gửi ngay để tắt máy an toàn</button></div>
</div>
<script>
const GAS = 'https://script.google.com/macros/s/AKfycbzDm2-MOt4oqwKflqoyTv_6lwFbri4nDKUVfxBP3V5SSMcSngRVPeDLo6S2YJEjuNHliA/exec';
const KEY = '129dccDCC';
const MAX_SIDE = 1920, QUALITY = 0.85;
const PHOTO_MAX_W = 2400;  // chế độ chụp nét cao (ImageCapture): cỡ ảnh yêu cầu, nhỏ hơn thì ghi nhanh hơn
const CAM_IDLE_MS = 8000;
const MAX_QUEUE = 20;
const FLUSH_IDLE_MS = 0; // >0: sau ngần ấy ms không chụp thêm thì tự gửi số ảnh còn lại (0 = tắt, chỉ gửi khi đủ batch hoặc bấm Gửi ngay)
const BATCH_SEND = 5; // đủ 5 ảnh thì tự gửi 1 lượt; ít hơn thì bấm nút ép gửi
const MAX_QUEUE_PERSIST = MAX_QUEUE;
const SHARPNESS_MIN = 80; // chỉnh theo thực tế nếu hay báo mờ oan hoặc không bắt được ảnh mờ

const v = document.getElementById('v'), st = document.getElementById('st');
const cntEl = document.getElementById('cnt'), qBadge = document.getElementById('qbadge');
const flash = document.getElementById('flash'), camOff = document.getElementById('camOff');
const pushBtn = document.getElementById('pushNow');

let sent = 0, queue = [], sending = false, camActive = false, idleTimer = null;
try { queue = JSON.parse(localStorage.getItem('qcq') || '[]'); } catch (e) {}

function saveQ() {
  try { localStorage.setItem('qcq', JSON.stringify(queue.slice(0, MAX_QUEUE_PERSIST))); } catch (e) {}
  const n = queue.length;
  qBadge.textContent = 'Hàng đợi: ' + n;
  qBadge.className = n === 0 ? 'empty' : 'pending';
  pushBtn.style.display = n > 0 ? 'inline-block' : 'none';
}

async function startCam() {
  if (camActive) { armIdleTimer(); return; }
  st.textContent = 'Đang mở camera...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 24, max: 30 } },
      audio: false
    });
    v.srcObject = stream;
    camActive = true;
    initTrackTools(stream.getVideoTracks()[0]);
    keepAwake();
    camOff.style.display = 'none';
    st.textContent = 'Chạm nút để chụp';
    armIdleTimer();
  } catch (e) { st.textContent = 'Lỗi camera: ' + e.message; }
}
function stopCam() {
  releaseAwake(); torchOn = false; torchBtn.classList.remove('on'); torchBtn.style.display = 'none'; zoomBadge.style.display = 'none';
  if (v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); v.srcObject = null; }
  camActive = false;
  camOff.style.display = 'flex';
  st.textContent = 'Chạm màn hình để bật camera';
  clearTimeout(idleTimer);
}
function armIdleTimer() { clearTimeout(idleTimer); idleTimer = setTimeout(stopCam, CAM_IDLE_MS); }

function sharpnessScore(canvas) {
  const w = 160, h = Math.round(w * canvas.height / canvas.width);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(canvas, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h).data;
  const gray = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const o = i * 4;
    gray[i] = 0.299 * data[o] + 0.587 * data[o + 1] + 0.114 * data[o + 2];
  }
  let variance = 0, n = 0;
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const idx = y * w + x;
      const lap = gray[idx - 1] + gray[idx + 1] + gray[idx - w] + gray[idx + w] - 4 * gray[idx];
      variance += lap * lap;
      n++;
    }
  }
  return variance / n;
}

// ── Chức năng camera: đèn flash, zoom 2 ngón, giữ màn hình sáng, toàn màn hình ──
const torchBtn = document.getElementById('torchBtn'), fsBtn = document.getElementById('fsBtn'), zoomBadge = document.getElementById('zoomBadge');
let torchOn = false, zoomCaps = null, zoomVal = 1, wakeLock = null, zoomHide = null;
function initTrackTools(track) {
  let caps = {}; try { caps = track.getCapabilities ? track.getCapabilities() : {}; } catch (e) {}
  torchBtn.style.display = caps.torch ? 'block' : 'none';
  zoomCaps = caps.zoom ? { min: caps.zoom.min, max: caps.zoom.max, step: caps.zoom.step || 0.1 } : null;
  zoomVal = zoomCaps ? (track.getSettings().zoom || zoomCaps.min) : 1;
}
torchBtn.addEventListener('click', async e => {
  e.stopPropagation();
  const track = v.srcObject?.getVideoTracks()[0]; if (!track) return;
  try { torchOn = !torchOn; await track.applyConstraints({ advanced: [{ torch: torchOn }] }); torchBtn.classList.toggle('on', torchOn); }
  catch (err) { torchOn = false; torchBtn.classList.remove('on'); }
  armIdleTimer();
});
async function setZoom(z) {
  const track = v.srcObject?.getVideoTracks()[0]; if (!track || !zoomCaps) return;
  zoomVal = Math.min(zoomCaps.max, Math.max(zoomCaps.min, z));
  try { await track.applyConstraints({ advanced: [{ zoom: zoomVal }] }); } catch (e) {}
  zoomBadge.textContent = zoomVal.toFixed(1) + '×'; zoomBadge.style.display = 'block';
  clearTimeout(zoomHide); zoomHide = setTimeout(() => zoomBadge.style.display = 'none', 1200);
  armIdleTimer();
}
let pinch0 = 0, zoom0 = 1;
const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
v.addEventListener('touchstart', e => { if (e.touches.length === 2) { pinch0 = dist(e.touches); zoom0 = zoomVal; } }, { passive: true });
v.addEventListener('touchmove', e => { if (e.touches.length === 2 && pinch0 && zoomCaps) setZoom(zoom0 * dist(e.touches) / pinch0); }, { passive: true });
v.addEventListener('touchend', () => { pinch0 = 0; }, { passive: true });
async function keepAwake() { try { if (navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {} }
function releaseAwake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
const isStandalone = () => matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches || navigator.standalone;
function goFullscreen() {
  if (isStandalone() || document.fullscreenElement || !document.documentElement.requestFullscreen) return;
  document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
}
fsBtn.addEventListener('click', e => { e.stopPropagation(); if (document.fullscreenElement) document.exitFullscreen(); else goFullscreen(); });
if (isStandalone()) fsBtn.style.display = 'none';
// Trình duyệt chỉ cho vào toàn màn hình sau thao tác chạm: thử ở mỗi lần chạm đầu cho đến khi thành công
function autoFs() { goFullscreen(); if (document.fullscreenElement || isStandalone()) document.removeEventListener('pointerup', autoFs); }
document.addEventListener('pointerup', autoFs);
document.addEventListener('visibilitychange', () => { if (!document.hidden && camActive) keepAwake(); });

// Chụp nhanh (mặc định): cắt ngay khung hình đang xem, gần như tức thì. Tắt ⚡ để dùng ImageCapture (nét cao nhưng ghi mất 1-2 giây).
let fastMode = true; try { fastMode = localStorage.getItem('fast') !== '0'; } catch (e) {}
const fastBtn = document.getElementById('fastBtn');
fastBtn.classList.toggle('on', fastMode);
fastBtn.addEventListener('click', e => {
  e.stopPropagation(); fastMode = !fastMode; fastBtn.classList.toggle('on', fastMode);
  try { localStorage.setItem('fast', fastMode ? '1' : '0'); } catch (err) {}
  st.textContent = fastMode ? '⚡ Chụp nhanh: bật' : 'Chụp nét cao: ghi chậm 1-2 giây, giữ máy yên';
  armIdleTimer();
});
function grabFrame() {
  const r = Math.min(1, MAX_SIDE / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(v.videoWidth * r); c.height = Math.round(v.videoHeight * r);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  return c;
}
async function grabPhoto() {
  const track = v.srcObject?.getVideoTracks()[0];
  if (track && 'ImageCapture' in window) {
    try {
      const ic = new ImageCapture(track), opt = {};
      try { const pc = await ic.getPhotoCapabilities(); if (pc.imageWidth && pc.imageWidth.max) opt.imageWidth = Math.min(pc.imageWidth.max, PHOTO_MAX_W); } catch (e) {}
      const bmp = await createImageBitmap(await ic.takePhoto(opt));
      const r = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * r); c.height = Math.round(bmp.height * r);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      if (bmp.close) bmp.close();
      return c;
    } catch (e) { /* rơi xuống cắt khung hình */ }
  }
  return grabFrame();
}
function shutterFeedback() {
  flash.style.opacity = .8; setTimeout(() => flash.style.opacity = 0, 120);
  if (navigator.vibrate) navigator.vibrate(30);
}

let capturing = false;
async function capture() {
  if (!camActive || !v.videoWidth) { startCam(); return; }
  if (queue.length >= MAX_QUEUE) {
    st.textContent = '⚠️ Hàng đợi đầy (' + MAX_QUEUE + '), chờ gửi bớt';
    armIdleTimer();
    return;
  }
  if (capturing) return;
  capturing = true;
  let c;
  if (fastMode) { c = grabFrame(); capturing = false; shutterFeedback(); }   // đồng bộ: lấy khung ngay lúc chạm
  else { try { c = await grabPhoto(); } finally { capturing = false; } shutterFeedback(); }

  const score = sharpnessScore(c);
  if (score < SHARPNESS_MIN) {
    st.textContent = '🌫️ Ảnh mờ (điểm ' + Math.round(score) + '), giữ máy yên và chụp lại';
    if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
    armIdleTimer();
    return;
  }

  queue.push(c.toDataURL('image/jpeg', QUALITY).split(',')[1]); saveQ();
  armIdleTimer();
  clearTimeout(flushTimer);
  if (FLUSH_IDLE_MS > 0 && queue.length < BATCH_SEND) flushTimer = setTimeout(() => pump(true), FLUSH_IDLE_MS);
  if (queue.length >= BATCH_SEND) pump(false);
  else st.textContent = '📥 Đã chụp (' + queue.length + '/' + BATCH_SEND + '), đủ ' + BATCH_SEND + ' sẽ tự gửi hoặc bấm Gửi ngay';
}

let retryTimer = null, flushTimer = null;
// force=true: gửi hết hàng đợi dù chưa đủ batch. Mỗi lượt POST 1 mảng ảnh = 1 lần gọi GAS.
async function pump(force) {
  if (sending) return; sending = true;
  clearTimeout(retryTimer);
  while (queue.length >= (force ? 1 : BATCH_SEND)) {
    const chunk = queue.slice(0, BATCH_SEND);
    try {
      st.textContent = 'Đang gửi ' + chunk.length + ' ảnh (' + queue.length + ' còn lại)...';
      const t0 = Date.now();
      const res = await fetch(GAS, { method: 'POST', body: JSON.stringify({ key: KEY, images: chunk }) });
      const j = await res.json();
      if (!j.ok) throw new Error(j.err || 'GAS lỗi');
      queue.splice(0, chunk.length); sent += chunk.length; saveQ();
      cntEl.textContent = 'Đã gửi: ' + sent;
      const tot = ((Date.now() - t0) / 1000).toFixed(1), gs = ((j.ms || 0) / 1000).toFixed(1), kb = Math.round(chunk.reduce((a, x) => a + x.length, 0) * 0.75 / 1024);
      st.textContent = '⏱ ' + chunk.length + ' ảnh ' + kb + 'KB: tổng ' + tot + 's (GAS xử lý ' + gs + 's) · ' + (queue.length ? 'còn ' + queue.length + ' ảnh chờ' : 'đã gửi hết, an toàn tắt máy');
      if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
    } catch (e) {
      st.textContent = '⚠️ Lỗi mạng (' + queue.length + ' ảnh chờ), thử lại sau 3s...';
      sending = false;
      retryTimer = setTimeout(() => pump(force), 3000);
      return;
    }
  }
  sending = false;
}

pushBtn.addEventListener('click', () => {
  st.textContent = 'Đang ép gửi toàn bộ hàng đợi...';
  pump(true);
});

document.getElementById('shot').addEventListener('click', e => { e.stopPropagation(); capture(); });

// Chạm vào video KHÔNG chụp nữa — chỉ thử lấy nét lại nếu thiết bị hỗ trợ
v.addEventListener('click', async () => {
  if (!camActive) { startCam(); return; }
  try {
    const track = v.srcObject?.getVideoTracks()[0];
    const caps = track?.getCapabilities?.();
    if (caps && caps.focusMode && caps.focusMode.includes('single-shot')) {
      await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
      st.textContent = '🔍 Đang lấy nét...';
      setTimeout(() => { if (camActive) st.textContent = 'Chạm nút để chụp'; }, 600);
    }
  } catch (err) {}
  armIdleTimer();
});

camOff.addEventListener('click', startCam);
document.body.addEventListener('touchstart', () => { if (!camActive) startCam(); }, { passive: true });
document.addEventListener('visibilitychange', () => { if (document.hidden) stopCam(); });

window.addEventListener('beforeunload', (e) => {
  if (queue.length > 0) {
    e.preventDefault();
    e.returnValue = 'Còn ' + queue.length + ' ảnh chưa gửi xong!';
    return e.returnValue;
  }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
saveQ();
if (queue.length) st.textContent = 'Còn ' + queue.length + ' ảnh chờ — bấm Gửi ngay';
</script>
</body>
</html>
